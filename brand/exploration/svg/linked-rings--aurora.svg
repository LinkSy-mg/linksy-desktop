<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="512" height="512">
  <style>.a{fill:#7457F5}.b{fill:#14BFA2}.c{fill:#4A2FCF}.m{fill:#7457F5;opacity:.18}.sa{fill:none;stroke:#7457F5}.sb{fill:none;stroke:#14BFA2}</style>
  <defs>

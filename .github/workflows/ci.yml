name: CI

# Every pull request and every push to main: the repository is public, so Actions are free.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# A newer push to the same branch or PR cancels the run still going.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # Linksy is for Linux only, and the phone runs the same core on Android.
  service:
    name: Core, service and CLI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

  gtk:
    name: GTK app and screen helper (Fedora)
    runs-on: ubuntu-latest
    container: registry.fedoraproject.org/fedora:latest
    steps:
      - run: dnf install -y --setopt=install_weak_deps=False gcc git gtk4-devel libadwaita-devel gstreamer1-devel gstreamer1-plugins-base-devel rust cargo clippy
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - run: cargo clippy -p linksy-app -p linksy-screen -- -D warnings

  gtk-opensuse:
    name: GTK app and screen helper (openSUSE Tumbleweed)
    runs-on: ubuntu-latest
    container: registry.opensuse.org/opensuse/tumbleweed:latest
    steps:
      # openSUSE's rust packages don't carry clippy: its rustup package does.
      - run: zypper --non-interactive install --no-recommends gcc git tar gzip rustup gtk4-devel libadwaita-devel gstreamer-devel gstreamer-plugins-base-devel
      - run: rustup toolchain install stable --profile minimal --component clippy && rustup default stable
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - run: cargo clippy -p linksy-app -p linksy-screen -- -D warnings

name: CI

# Manual only: builds and tests run on our machine (no Actions minutes).
on:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  core:
    name: Core (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p linksy-core

  service:
    name: Service and CLI (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

  gtk:
    name: GTK app and screen helper (Fedora)
    runs-on: ubuntu-latest
    container: registry.fedoraproject.org/fedora:latest
    steps:
      - run: dnf install -y --setopt=install_weak_deps=False gcc git gtk4-devel libadwaita-devel gstreamer1-devel gstreamer1-plugins-base-devel rust cargo clippy
      - uses: actions/checkout@v5
      - run: cargo clippy -p linksy-app -p linksy-screen -- -D warnings

  gtk-opensuse:
    name: GTK app and screen helper (openSUSE Tumbleweed)
    runs-on: ubuntu-latest
    container: registry.opensuse.org/opensuse/tumbleweed:latest
    steps:
      # The toolchain comes from rustup (needs curl): openSUSE's rust packages don't carry clippy.
      - run: zypper --non-interactive install --no-recommends gcc git tar gzip curl gtk4-devel libadwaita-devel gstreamer-devel gstreamer-plugins-base-devel
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - run: cargo clippy -p linksy-app -p linksy-screen -- -D warnings

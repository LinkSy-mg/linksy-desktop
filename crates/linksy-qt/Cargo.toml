[package]
name = "linksy-qt"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "linksy-qt"
path = "src/main.rs"

[dependencies]
cxx = "1.0.205"
cxx-qt = "0.10.0"
cxx-qt-lib = { version = "0.10.0", features = ["qt_gui", "qt_qml"] }
linksy-ipc = { path = "../linksy-ipc" }
linksy-i18n = { path = "../linksy-i18n" }
linksy-news = { path = "../linksy-news" }
linksy-setup = { path = "../linksy-setup" }
qrcode = { version = "0.14.1", default-features = false }
serde_json = "1.0.154"
tokio = { version = "1.53.3", features = ["rt-multi-thread", "sync", "macros", "time"] }

[build-dependencies]
cxx-qt-build = "0.10.0"
pkg-config = "0.3.34"

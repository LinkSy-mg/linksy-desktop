[package]
name = "linksy-screen"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
linksy-logs = { path = "../linksy-logs" }
ashpd = { version = "0.13.13", default-features = false, features = ["tokio", "screencast", "remote_desktop"] }
gstreamer = "0.25.4"
linksy-core = { path = "../linksy-core" }
tokio = { version = "1.53.3", features = ["rt-multi-thread", "macros", "time"] }
libc = "0.2.191"
# GNOME's display layout, to keep a second display in it
zbus = { version = "5.19.0", default-features = false, features = ["tokio"] }
# KDE's second display: its size on the desktop when it's scaled
wayland-client = "0.31.15"
wayland-protocols = { version = "0.32.12", features = ["client", "unstable"] }
# X11 desktops: the monitor to share (RandR) and the viewer's input (XTest)
x11rb = { version = "0.13.2", features = ["randr", "xtest"] }

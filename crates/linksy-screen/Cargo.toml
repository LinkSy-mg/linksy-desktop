[package]
name = "linksy-screen"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
ashpd = { version = "0.13.13", default-features = false, features = ["tokio", "screencast", "remote_desktop"] }
gstreamer = "0.25.4"
linksy-core = { path = "../linksy-core" }
tokio = { version = "1.53.3", features = ["rt-multi-thread", "macros"] }

[package]
name = "linksy-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
blake3 = "1.8.7"
hex = "0.4.3"
mdns-sd = "0.21.5"
quinn = { version = "0.11.12", default-features = false, features = ["runtime-tokio", "rustls-ring", "log"] }
rcgen = "0.14.10"
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "logging"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
thiserror = "2.0.21"
tokio = { version = "1.53.3", features = ["rt-multi-thread", "macros", "fs", "io-util", "sync", "time", "net"] }
tracing = "0.1.44"
uuid = { version = "1.28.0", features = ["v4", "serde"] }

[dev-dependencies]
tempfile = "3.27.0"

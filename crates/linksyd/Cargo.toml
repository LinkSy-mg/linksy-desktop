[package]
name = "linksyd"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
linksy-core = { version = "0.1.0", path = "../linksy-core" }
linksy-ipc = { version = "0.1.0", path = "../linksy-ipc" }
serde_json = "1.0.154"
tokio = { version = "1.53.3", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "signal", "process"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["fmt", "ansi"] }

[target.'cfg(target_os = "linux")'.dependencies]
notify-rust = "4.18.2"

[dev-dependencies]
tempfile = "3.27.0"

[package]
name = "linksyd"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
linksy-logs = { path = "../linksy-logs" }
linksy-core = { path = "../linksy-core" }
linksy-ipc = { path = "../linksy-ipc" }
linksy-i18n = { path = "../linksy-i18n" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
base64 = "0.23.1"
ureq = { version = "3.4.2", default-features = false, features = ["rustls"] }
tokio = { version = "1.53.3", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "signal", "process"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["fmt", "ansi"] }
argon2 = "0.5.3"
libc = "0.2.191"

[target.'cfg(target_os = "linux")'.dependencies]
notify-rust = "4.18.2"
zbus = { version = "5.19.0", default-features = false, features = ["async-io"] }
futures-util = { version = "0.3.34", default-features = false }
nusb = { version = "0.2.8", features = ["tokio"] }
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg"] }
ksni = { version = "0.3.7", default-features = false, features = ["async-io"] }

[dev-dependencies]
tempfile = "3.27.0"

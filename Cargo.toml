[workspace]
resolver = "3"
members = ["crates/*"]
# The GTK app and the screen helper need gtk4/libadwaita and GStreamer headers; build them
# with `-p linksy-app -p linksy-screen` (see README).
default-members = ["crates/linksy-core", "crates/linksy-ipc", "crates/linksyd", "crates/linksy-cli", "crates/linksy-news", "crates/linksy-upgrade", "crates/linksy-logs"]

[workspace.package]
version = "0.9.4"
edition = "2024"
license = "AGPL-3.0-or-later"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
opt-level = 3

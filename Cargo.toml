[workspace]
resolver = "3"
members = ["crates/*"]
# The GTK app and the screen helper need gtk4/libadwaita and GStreamer headers; build them
# with `-p linksy-app -p linksy-screen` (see README).
default-members = ["crates/linksy-core", "crates/linksy-ipc", "crates/linksyd", "crates/linksy-cli", "crates/linksy-news", "crates/linksy-upgrade", "crates/linksy-logs", "crates/linksy-host"]

[workspace.package]
version = "0.12.4"
edition = "2024"
license = "AGPL-3.0-or-later"

[profile.release]
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"
# Small by default: the service mostly waits, and less code means less memory. The hot paths
# below (QUIC, TLS, hashing) stay fast.
opt-level = "s"

[profile.release.package.ring]
opt-level = 3

[profile.release.package.rustls]
opt-level = 3

[profile.release.package.blake3]
opt-level = 3

[profile.release.package.quinn-proto]
opt-level = 3

[profile.release.package.quinn-udp]
opt-level = 3

[profile.release.package.noq-proto]
opt-level = 3

[profile.release.package.noq-udp]
opt-level = 3

[profile.release.package.aes-gcm]
opt-level = 3

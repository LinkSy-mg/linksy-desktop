[workspace]
resolver = "3"
members = ["crates/*"]
# The GTK app needs gtk4/libadwaita headers; build it with `-p linksy-app` (see README).
default-members = ["crates/linksy-core", "crates/linksy-ipc", "crates/linksyd", "crates/linksy-cli"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
opt-level = 3
